[package]
name = "Wikipedia"
edition = "2024"

[dependencies]
regex = "1.13.1"
html-escape = "0.2.15"
spmc = "0.3.0" # To be replaced by std::sync::mpmc when stable: https://doc.rust-lang.org/std/sync/mpmc/index.html

[profile.release]
# For profiling:
#debug = true
#split-debuginfo = "off"
#strip = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
implicit_hasher = "allow"
items_after_statements = "allow"
missing_panics_doc = "allow"
stable_sort_primitive = "allow"
uninlined_format_args = "allow"
